services:
  navidrome:
    image: ${REGISTRY_PREFIX}/deluan/navidrome:0.54.5
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      ND_DATAFOLDER: /data
      ND_MUSICFOLDER: /music
      ND_SCANSCHEDULE: ${ND_SCANSCHEDULE}
      ND_LOGLEVEL: info
      ND_UID: ${PUID}
      ND_GID: ${PGID}
      TZ: ${TZ}
    ports:
      - "${NAVIDROME_BIND_ADDRESS}:${NAVIDROME_PORT}:4533"
    volumes:
      - "${MUSIC_ROOT}:/music:ro"
      - "${NAVIDROME_DATA}:/data"
    networks:
      - music-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4533/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  cleaner:
    build:
      context: ./cleaner
      args:
        PYTHON_BASE_IMAGE: ${REGISTRY_PREFIX}/library/python:3.12.9-alpine3.21
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    environment:
      CACHE_DIR: /cache
      CACHE_MAX_AGE_DAYS: ${CACHE_MAX_AGE_DAYS}
      CACHE_MAX_SIZE_GB: ${CACHE_MAX_SIZE_GB}
      CACHE_MIN_AGE_MINUTES: ${CACHE_MIN_AGE_MINUTES}
      CLEANER_INTERVAL_SECONDS: ${CLEANER_INTERVAL_SECONDS}
      DRY_RUN: ${DRY_RUN}
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_USER: ${NAVIDROME_USER}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD}
      NAVIDROME_TIMEOUT_SECONDS: ${NAVIDROME_TIMEOUT_SECONDS}
      LOCK_FILE: ${LOCK_FILE}
      TZ: ${TZ}
    volumes:
      - "${MUSIC_ROOT}/cache:/cache"
    networks:
      - music-internal
    depends_on:
      navidrome:
        condition: service_healthy

  ingest:
    image: ${REGISTRY_PREFIX}/library/alpine:3.21.3
    profiles: ["ingest"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    command: ["sh", "-c", "echo 'Ingest placeholder: add your own loader.'; exec sleep infinity"]
    volumes:
      - "${MUSIC_ROOT}/cache:/music/cache"
    networks:
      - music-internal

networks:
  music-internal:
    internal: true
